# ══════════════════════════════════════════════════════════════════════════════
# ARX COLLECTIVE — NGINX REVERSE PROXY & ADMIN SECURITY CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
# Place inside your Nginx server { ... } block.
# 
# 1. Custom Secret Path Obscurity: Only allow access to the secret admin URI.
# 2. IP Whitelisting: Blocks all other IPs with HTTP 403 Forbidden at the edge.
# 3. Rate Limiting: Limits login attempts to mitigate brute-force dictionary attacks.
# 4. Scanner Blocking: Generic /admin is instantly blocked or dropped.
# ══════════════════════════════════════════════════════════════════════════════

# ── 1. RATE LIMITING ZONE (Define in http { ... } context in nginx.conf) ──────
# limit_req_zone $binary_remote_addr zone=admin_login_zone:10m rate=5r/m;

# ── 2. BLOCK GENERIC /admin (Obscurity & Scanner Defense) ─────────────────────
location ~* ^/admin(/.*)?$ {
    # Return 404 Not Found to completely obscure admin existence from automated crawlers
    return 404;
}

# ── 3. PROTECTED SECRET ADMIN PATH ──────────────────────────────────────────
# Replace '/arx-ops-console-7729' with your ADMIN_SECRET_PATH from .env
location /arx-ops-console-7729 {

    # ── IP Whitelist (403 Forbidden for unauthorized IPs) ──
    # Allow local connections
    allow 127.0.0.1;
    allow ::1;

    # Allow approved administrator static IP addresses (Add your office/VPN IPs here):
    # allow 198.51.100.25;
    # allow 203.0.113.50;

    # Deny all other IP addresses
    deny all;

    # Proxy headers
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeouts
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
}

# ── 4. STRICT LOGIN RATE LIMITING ───────────────────────────────────────────
location /arx-ops-console-7729/login {
    # limit_req zone=admin_login_zone burst=3 nodelay;
    # limit_req_status 429;

    # Inherit IP restrictions
    allow 127.0.0.1;
    allow ::1;
    # allow 198.51.100.25;
    deny all;

    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
